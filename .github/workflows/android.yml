name: Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes da lógica compartilhada
        run: ./gradlew --no-daemon :shared:testDebugUnitTest

      - name: Gerar APK de teste
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rotta-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Publicar APK para baixar no celular
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk rotta-debug.apk
          gh release delete ultima-build --yes --cleanup-tag || true
          gh release create ultima-build rotta-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Última build de teste" \
            --notes "APK de teste gerado a partir do commit ${GITHUB_SHA::7}. Baixe rotta-debug.apk no celular Android e instale."
